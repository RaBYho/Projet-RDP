name: CI - Tests Frontend & Backend

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Build (vérifie que le projet compile)
        run: npm run build

      - name: Tests unitaires
        run: npm test --if-present -- --run

  backend:
    name: Backend (Python / FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Tests API (contrat JSON, endpoints, scénarios)
        run: pytest tests/test_api.py -v

      - name: Autres tests (logique métier, résolveur de conflits, etc.)
        run: pytest --ignore=tests/test_api.py -v

  # Job final qui bloque la fusion si l'un des deux échoue
  status-check:
    name: Vérification globale
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    if: always()
    steps:
      - name: Vérifier le résultat des jobs
        run: |
          if [ "${{ needs.frontend.result }}" != "success" ] || [ "${{ needs.backend.result }}" != "success" ]; then
            echo "Un ou plusieurs tests ont échoué."
            exit 1
          fi
          echo "Tous les tests sont passés avec succès."
